service: auth-service

plugins:
  - serverless-esbuild
  - serverless-offline
  - serverless-localstack

provider:
  name: aws
  runtime: nodejs22.x
  memorySize: 128
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    # Lambda sets AWS_REGION and the role credentials itself (reserved names).
    STAGE: ${self:provider.stage}
    LOCAL_AWS_ENDPOINT: ${self:custom.awsEndpoint.${self:provider.stage}, ''}
    AUTH0_PUBLIC_KEY: ${file(secret.pem)}
    # Your Auth0 API identifier and tenant URL, e.g.
    #   AUTH0_AUDIENCE=https://auction-api  AUTH0_ISSUER=https://<tenant>.auth0.com/
    AUTH0_AUDIENCE: ${env:AUTH0_AUDIENCE, ''}
    AUTH0_ISSUER: ${env:AUTH0_ISSUER, ''}
    EMAIL_CLAIM: ${env:EMAIL_CLAIM, 'https://serverless-auction/email'}

functions:
  auth:
    handler: src/handlers/auth.handler
    cors: true
  publicEndpoint:
    handler: src/handlers/public.handler
    events:
      - http:
          path: public
          method: POST
          cors: true
  privateEndpoint:
    handler: src/handlers/private.handler
    events:
      - http:
          path: private
          method: POST
          authorizer: auth
          cors: true

resources:
  Resources:
    # This response is needed for custom authorizer failures cors support ¯\_(ツ)_/¯
    GatewayResponse:
      Type: 'AWS::ApiGateway::GatewayResponse'
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
        ResponseType: EXPIRED_TOKEN
        RestApiId:
          Ref: 'ApiGatewayRestApi'
        StatusCode: '401'
    AuthFailureGatewayResponse:
      Type: 'AWS::ApiGateway::GatewayResponse'
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: 'ApiGatewayRestApi'
        StatusCode: '401'
custom:
  awsEndpoint:
    local: http://localhost:4566
    dev: ''
    prod: ''
  localstack:
    stages: [local]
    lambda:
      mountCode: true
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: "node22"
    platform: "node"
    external:
      - aws-sdk
