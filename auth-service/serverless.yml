service: auth-service

plugins:
  - serverless-esbuild
  - serverless-offline
  - serverless-localstack

provider:
  name: aws
  runtime: nodejs20.x
  memorySize: 128
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    AWS_REGION: ${self:provider.region}
    # When running locally:
    AWS_ENDPOINT: ${self:custom.awsEndpoint.${self:provider.stage}, ''}
    AWS_ACCESS_KEY_ID: ${env:AWS_ACCESS_KEY_ID, 'test'}
    AWS_SECRET_ACCESS_KEY: ${env:AWS_SECRET_ACCESS_KEY, 'test'}
    AUTH0_PUBLIC_KEY: ${file(secret.pem)}

functions:
  auth:
    handler: src/handlers/auth.handler
  publicEndpoint:
    handler: src/handlers/public.handler
    events:
      - http:
          path: public
          method: POST
          cors: true
  # privateEndpoint:
  #   handler: src/handlers/private.handler
  #   events:
  #     - http:
  #         path: private
  #         method: POST
  #         authorizer: ${self:custom.config.authorizer}
  #         cors: true

resources:
  Resources:
    # This response is needed for custom authorizer failures cors support ¯\_(ツ)_/¯
    GatewayResponse:
      Type: "AWS::ApiGateway::GatewayResponse"
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
        ResponseType: EXPIRED_TOKEN
        RestApiId:
          Ref: "ApiGatewayRestApi"
        StatusCode: "401"
    AuthFailureGatewayResponse:
      Type: "AWS::ApiGateway::GatewayResponse"
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: "ApiGatewayRestApi"
        StatusCode: "401"
custom:
  config: ${file(config/config.${self:provider.stage}.yml)}
  awsEndpoint:
    local: http://localhost:4566
    dev: ""
    prod: ""
  localstack:
    stages: [local]
    host: http://localhost
    edgePort: 4566
    autostart: false
    lambda:
      mountCode: false
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: "node20"
    platform: "node"
    external:
      - aws-sdk
