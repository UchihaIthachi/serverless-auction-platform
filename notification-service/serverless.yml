service: notification-service

plugins:
  - serverless-esbuild
  - serverless-pseudo-parameters
  - serverless-offline
  - serverless-localstack

provider:
  name: aws
  runtime: ${self:custom.runtime.${self:provider.stage}, 'nodejs22.x'}
  memorySize: 256
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  iamRoleStatements:
    - ${file(iam/SendMailIAM.yml):SendMailIAM}
  environment:
    # Lambda sets AWS_REGION and the role credentials itself (reserved names).
    STAGE: ${self:provider.stage}
    LOCAL_AWS_ENDPOINT: ${self:custom.awsEndpoint.${self:provider.stage}, ''}
    # Must be a verified SES identity in your account (test@example.com is
    # verified by scripts/localstack-bootstrap.sh for local runs).
    SENDER_EMAIL: ${env:SENDER_EMAIL, 'test@example.com'}

resources:
  Conditions:
    HasAlertEmail: !Not [!Equals ["${env:ALERT_EMAIL, ''}", '']]
  Resources:
    MailQueue: ${file(resources/MailQueue.yml):MailQueue}
    MailDeadLetterQueue: ${file(resources/MailQueue.yml):MailDeadLetterQueue}
    AlertsTopic: ${file(resources/Alerts.yml):AlertsTopic}
    AlertsEmailSubscription: ${file(resources/Alerts.yml):AlertsEmailSubscription}
    MailDlqAlarm: ${file(resources/Alerts.yml):MailDlqAlarm}
    MailQueueAgeAlarm: ${file(resources/Alerts.yml):MailQueueAgeAlarm}
  Outputs:
    MailQueueArn: ${file(resources/MailQueue.yml):Outputs.MailQueueArn}
    MailQueueUrl: ${file(resources/MailQueue.yml):Outputs.MailQueueUrl}
    AlertsTopicArn: ${file(resources/Alerts.yml):Outputs.AlertsTopicArn}
  
functions:
  sendMail:
    handler: src/handlers/sendMail.handler
    events:
      - sqs:
          arn: ${self:custom.mailQueue.arn}
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

custom:
  awsEndpoint:
    local: http://localhost:4566
    localstack: http://localhost.localstack.cloud:4566   # from inside LocalStack's Lambda containers
    dev: ''
    prod: ''
  runtime:
    localstack: nodejs20.x   # LocalStack 3.5 has no nodejs22.x runtime
  localstack:
    # Any deploy with these stages goes to LocalStack (localhost:4566), never to AWS.
    stages: [local, localstack]
    lambda:
      mountCode: false
  mailQueue:
    name: MailQueue-${self:provider.stage}
    arn: !GetAtt MailQueue.Arn
    url: !Ref MailQueue
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: "node20"
    platform: "node"
    external:
      - aws-sdk
