AuctionsTableIAM:
  Effect: Allow
  Action:
    - dynamodb:PutItem
    - dynamodb:GetItem
    - dynamodb:UpdateItem
    - dynamodb:Query
  Resource:
    - ${self:custom.AuctionsTable.arn}
    - !Join ['/', [ '${self:custom.AuctionsTable.arn}', 'index', 'statusAndEndDate' ]]

# closeAuction's transaction puts outbox rows (TransactWriteItems is
# authorised per item: UpdateItem on AuctionsTable, PutItem here).
OutboxTableIAM:
  Effect: Allow
  Action:
    - dynamodb:PutItem
  Resource:
    - ${self:custom.OutboxTable.arn}
