service: auction-service

plugins:
  - serverless-esbuild
  - serverless-pseudo-parameters
  - serverless-offline
  - serverless-localstack

provider:
  name: aws
  runtime: nodejs22.x
  memorySize: 256
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  environment:
    # Lambda sets AWS_REGION and the role credentials itself (they are reserved
    # names). Only local runs point the SDK at LocalStack.
    STAGE: ${self:provider.stage}
    LOCAL_AWS_ENDPOINT: ${self:custom.config.awsEndpoint}
    AUCTIONS_TABLE_NAME: ${self:custom.AuctionsTable.name}
    MAIL_QUEUE_URL: ${self:custom.config.mailQueueUrl}
    AUCTIONS_BUCKET_NAME: ${self:custom.config.auctionsBucketName}
  iamRoleStatements:
    - ${file(iam/AuctionsTableIAM.yml):AuctionsTableIAM}
    - ${file(iam/MailQueueIAM.yml):MailQueueIAM}
    - ${file(iam/AuctionsBucketIAM.yml):AuctionsBucketIAM}

resources:
  Resources:
    AuctionsTable: ${file(resources/AuctionsTable.yml):AuctionsTable}
    AuctionsBucket: ${file(resources/AuctionsBucket.yml):AuctionsBucket}
    AuctionsBucketPolicy: ${file(resources/AuctionsBucket.yml):AuctionsBucketPolicy}
    # The custom authorizer lives in auth-service; return CORS headers on its
    # 401/403 responses too, so browsers can read the error.
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
    
functions:
  createAuction:
    handler: src/handlers/createAuction.handler
    events:
      - http:
          method: POST
          path: /auction
          cors: true
          authorizer: ${self:custom.config.authorizer}

  getAuctions:
    handler: src/handlers/getAuctions.handler
    events:
      - http:
          method: GET
          path: /auctions
          cors: true
          authorizer: ${self:custom.config.authorizer}

  getAuction:
    handler: src/handlers/getAuction.handler
    events:
      - http:
          method: GET
          path: /auction/{id}
          cors: true
          authorizer: ${self:custom.config.authorizer}

  placeBid:
    handler: src/handlers/placeBid.handler
    events:
      - http:
          method: PATCH
          path: auction/{id}/bid
          cors: true
          authorizer: ${self:custom.config.authorizer}

  uploadAuctionPicture:
    handler: src/handlers/uploadAuctionPicture.handler
    events:
      - http:
          method: PATCH
          path: auction/{id}/picture
          cors: true
          authorizer: ${self:custom.config.authorizer}

  processAuctions:
    handler: src/handlers/processAuctions.handler
    timeout: 50
    events:
      - schedule: rate(1 minute)

custom:
  serverless-offline:
    noPrependStageInUrl: true
  config: ${file(config/config.${self:provider.stage}.yml)}
  localstack:
    stages: [local]
    lambda:
      mountCode: true
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: "node22"
    platform: "node"
    external:
      - aws-sdk
  AuctionsTable:
    name: AuctionsTable-${self:provider.stage}
    arn: !GetAtt AuctionsTable.Arn
  MailQueue:
    arn: ${self:custom.config.mailQueueArn}
    url: ${self:custom.config.mailQueueUrl}
  AuctionsBucket:
    name: ${self:custom.config.auctionsBucketName}
