service: auction-service

plugins:
  - serverless-bundle
  - serverless-pseudo-parameters

provider:
  name: aws
  runtime: nodejs18.x
  memorySize: 256
  stage: ${opt:stage, 'dev'}
  region: eu-west-1
  environment:
    AUCTIONS_TABLE_NAME: ${self:custom.AuctionsTable.name}
    MAIL_QUEUE_URL: ${self:custom.MailQueue.url}
    AUCTIONS_BUCKET_NAME: ${self:custom.AuctionsBucket.name}
  iamRoleStatements:
    - ${file(iam/AuctionsTableIAM.yml):AuctionsTableIAM}
    - ${file(iam/MailQueueIAM.yml):MailQueueIAM}
    - ${file(iam/AuctionsBucketIAM.yml):AuctionsBucketIAM}

resources:
  Resources:
    AuctionsTable: ${file(resources/AuctionsTable.yml):AuctionsTable}
    AuctionsBucket: ${file(resources/AuctionsBucket.yml):AuctionsBucket}
    AuctionsBucketPolicy: ${file(resources/AuctionsBucket.yml):AuctionsBucketPolicy}
    
functions:
  createAuction:
    handler: src/handlers/createAuction.handler
    events:
      - http:
          method: POST
          path: /auction
          authorizer: ${self:custom.authorizer}
          cors:
            origins:
              - 'http://localhost:3000' # For local Next.js development
              # TODO: Replace '*.vercel.app' with specific Vercel production and preview domains once known
              - 'https://*.vercel.app'  # Broad placeholder for Vercel domains
            methods:
              - POST
            headers:
              - Content-Type
              - Authorization     # For JWT
              - Accept
              - Origin
              - DNT               # Do Not Track
              - User-Agent
              - Referer
              - Connection
              - Cache-Control
              - Pragma
              - Expires
              - X-Requested-With
              - X-HTTP-Method-Override
            allowCredentials: false # For JWT in Authorization header, this is usually false.

  getAuctions:
    handler: src/handlers/getAuctions.handler
    events:
      - http:
          method: GET
          path: /auctions
          authorizer: ${self:custom.authorizer}
          cors:
            origins:
              - 'http://localhost:3000' # For local Next.js development
              # TODO: Replace '*.vercel.app' with specific Vercel production and preview domains once known
              - 'https://*.vercel.app'  # Broad placeholder for Vercel domains
            methods:
              - GET
            headers:
              - Content-Type
              - Authorization     # For JWT
              - Accept
              - Origin
              - DNT               # Do Not Track
              - User-Agent
              - Referer
              - Connection
              - Cache-Control
              - Pragma
              - Expires
              - X-Requested-With
              - X-HTTP-Method-Override
            allowCredentials: false # For JWT in Authorization header, this is usually false.

  getAuction:
    handler: src/handlers/getAuction.handler
    events:
      - http:
          method: GET
          path: /auction/{id}
          authorizer: ${self:custom.authorizer}
          cors:
            origins:
              - 'http://localhost:3000' # For local Next.js development
              # TODO: Replace '*.vercel.app' with specific Vercel production and preview domains once known
              - 'https://*.vercel.app'  # Broad placeholder for Vercel domains
            methods:
              - GET
            headers:
              - Content-Type
              - Authorization     # For JWT
              - Accept
              - Origin
              - DNT               # Do Not Track
              - User-Agent
              - Referer
              - Connection
              - Cache-Control
              - Pragma
              - Expires
              - X-Requested-With
              - X-HTTP-Method-Override
            allowCredentials: false # For JWT in Authorization header, this is usually false.

  placeBid:
    handler: src/handlers/placeBid.handler
    events:
      - http:
          method: PATCH
          path: auction/{id}/bid
          authorizer: ${self:custom.authorizer}
          cors:
            origins:
              - 'http://localhost:3000' # For local Next.js development
              # TODO: Replace '*.vercel.app' with specific Vercel production and preview domains once known
              - 'https://*.vercel.app'  # Broad placeholder for Vercel domains
            methods:
              - PATCH
            headers:
              - Content-Type
              - Authorization     # For JWT
              - Accept
              - Origin
              - DNT               # Do Not Track
              - User-Agent
              - Referer
              - Connection
              - Cache-Control
              - Pragma
              - Expires
              - X-Requested-With
              - X-HTTP-Method-Override
            allowCredentials: false # For JWT in Authorization header, this is usually false.

  uploadAuctionPicture:
    handler: src/handlers/uploadAuctionPicture.handler
    events:
      - http:
          method: PATCH
          path: auction/{id}/picture
          authorizer: ${self:custom.authorizer}
          cors:
            origins:
              - 'http://localhost:3000' # For local Next.js development
              # TODO: Replace '*.vercel.app' with specific Vercel production and preview domains once known
              - 'https://*.vercel.app'  # Broad placeholder for Vercel domains
            methods:
              - PATCH
            headers:
              - Content-Type
              - Authorization     # For JWT
              - Accept
              - Origin
              - DNT               # Do Not Track
              - User-Agent
              - Referer
              - Connection
              - Cache-Control
              - Pragma
              - Expires
              - X-Requested-With
              - X-HTTP-Method-Override
            allowCredentials: false # For JWT in Authorization header, this is usually false.

  processAuctions:
    handler: src/handlers/processAuctions.handler
    events:
      - schedule: rate(1 minute)

custom:
  authorizer: arn:aws:lambda:#{AWS::Region}:#{AWS::AccountId}:function:auth-service-${self:provider.stage}-auth
  AuctionsTable:
    name: !Ref AuctionsTable
    arn: !GetAtt AuctionsTable.Arn
  MailQueue:
    arn: ${cf:notification-service-${self:provider.stage}.MailQueueArn}
    url: ${cf:notification-service-${self:provider.stage}.MailQueueUrl}
  AuctionsBucket:
    name: auctions-bucket-sj19asxm-${self:provider.stage}
  bundle:
    linting: false