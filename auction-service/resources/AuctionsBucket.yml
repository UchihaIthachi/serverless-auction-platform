AuctionsBucket:
  Type: AWS::S3::Bucket
  Properties:
    BucketName: ${self:custom.AuctionsBucket.name}
    OwnershipControls:
      Rules:
        - ObjectOwnership: BucketOwnerEnforced
    # With CloudFront (dev/prod) the bucket is completely private. Without it
    # (LocalStack) a public-read policy is allowed so picture URLs open.
    PublicAccessBlockConfiguration:
      BlockPublicAcls: true
      IgnorePublicAcls: true
      BlockPublicPolicy: !If [UseCdn, true, false]
      RestrictPublicBuckets: !If [UseCdn, true, false]
    LifecycleConfiguration:
      Rules:
        - Id: AbortIncompleteUploads
          Status: Enabled
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 1

# dev/prod: only CloudFront, and only this distribution, may read objects.
AuctionsBucketCdnPolicy:
  Type: AWS::S3::BucketPolicy
  Condition: UseCdn
  Properties:
    Bucket: !Ref AuctionsBucket
    PolicyDocument:
      Version: '2012-10-17'
      Statement:
        - Sid: CloudFrontReadViaOAC
          Effect: Allow
          Principal: { Service: cloudfront.amazonaws.com }
          Action: s3:GetObject
          Resource: arn:aws:s3:::${self:custom.AuctionsBucket.name}/*
          Condition:
            StringEquals:
              AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${PicturesDistribution}

# Stages without CloudFront: public read, as before.
AuctionsBucketPublicReadPolicy:
  Type: AWS::S3::BucketPolicy
  Condition: NoCdn
  Properties:
    Bucket: !Ref AuctionsBucket
    PolicyDocument:
      Statement:
        - Sid: PublicRead
          Effect: Allow
          Principal: '*'
          Action:
            - s3:GetObject
          Resource: arn:aws:s3:::${self:custom.AuctionsBucket.name}/*
